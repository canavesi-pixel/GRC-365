<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
    @font-face {
        font-family: 'Baloo 2';
        src: url(Baloo2-VariableFont_wght.ttf);
    }
    :root {
        --navy: #2c3968;
        --plum: #453257;
        --teal: #3f7686;
        --periwinkle: #6f6f9c;
        --lavender: #8f93c0;
        --ink: #3d3a3f;
        --paper: #fffdf9;
        --blush: #f3d9e0;
    }
    body {
        background: linear-gradient(160deg, #eef2f7 0%, #f4eef7 100%);
        margin: 0;
        padding: 48px 0;
    }
    #page {
        width: 1024px;
        min-height: 1224px;
        background: var(--paper);
        margin: 0 auto;
        padding: 0 64px 64px 64px;
        box-sizing: border-box;
        box-shadow: 5px 8px 20px rgba(45, 57, 104, 0.3), 0 0 0 1px rgba(45, 57, 104, 0.08);
        overflow: hidden;
    }
    .banner {
        width: calc(100% + 128px);
        height: 220px;
        margin: 0 -64px 40px -64px;
        overflow: hidden;
    }
    .banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    nav.tabs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 0 0 40px 0;
    }
    nav.tabs a {
        font: 700 12.5pt/1em 'Nunito', sans-serif;
        letter-spacing: 0.3px;
        text-decoration: none;
        color: var(--periwinkle);
        background: #f4eef7;
        padding: 10px 26px;
        border-radius: 999px;
        border: 2px solid transparent;
        transition: border-color 0.15s ease, color 0.15s ease;
    }
    nav.tabs a:hover {
        color: var(--plum);
        border-color: var(--lavender);
    }
    nav.tabs a.active {
        color: var(--paper);
        background: var(--plum);
        box-shadow: 2px 3px 0px var(--lavender);
    }
    nav.tabs { position: relative; z-index: 50; }
    nav.tabs .dropdown {
        position: relative;
        display: flex;
    }
    nav.tabs .dropdown-toggle::after {
        content: "";
        display: inline-block;
        margin-left: 10px;
        vertical-align: middle;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid currentColor;
        transition: transform 0.2s ease;
    }
    nav.tabs .dropdown:hover .dropdown-toggle::after,
    nav.tabs .dropdown:focus-within .dropdown-toggle::after {
        transform: rotate(180deg);
    }
    nav.tabs .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(-6px);
        min-width: 100%;
        padding-top: 8px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }
    nav.tabs .dropdown:hover .dropdown-menu,
    nav.tabs .dropdown:focus-within .dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
    }
    nav.tabs .dropdown-menu a {
        display: block;
        text-align: center;
        white-space: nowrap;
        border-radius: 0;
        padding: 12px 22px;
        background: var(--paper);
        color: var(--plum);
        border: 2px solid #e3e0ee;
        border-bottom-width: 1px;
        box-shadow: none;
    }
    nav.tabs .dropdown-menu a:first-child { border-radius: 16px 16px 0 0; }
    nav.tabs .dropdown-menu a:last-child  { border-radius: 0 0 16px 16px; border-bottom-width: 2px; }
    nav.tabs .dropdown-menu a:hover {
        background: #f4eef7;
        border-color: var(--lavender);
    }
    nav.tabs .dropdown-menu a.current {
        background: var(--plum);
        color: var(--paper);
    }
    h1 {
        font: 700 56pt/1.0em 'Baloo 2', cursive;
        text-align: center;
        color: var(--plum);
        text-shadow: 3px 3px 0px var(--lavender);
        margin: 0;
    }
    p.intro {
        text-align: center;
        font: 600 15pt/1em 'Nunito', sans-serif;
        color: var(--ink);
        max-width: 560px;
        margin: 22px auto 40px auto;
    }
    .highlight {
        color: var(--teal);
        font-weight: 700;
    }
    .video-frame {
        display: block;
        margin: 0 auto 16px auto;
        width: 720px;
        max-width: 100%;
        border-radius: 14px;
        border: 1px solid dimgray;
        box-shadow: 2px 3px 6px dimgray;
    }
    .video-caption {
        text-align: center;
        font: 400 14pt/1.65em 'Nunito', sans-serif;
        color: var(--periwinkle);
        margin: 0 auto 40px auto;
    }
    .signature-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 0 0 12px 0;
    }
    .signature-row img {
        height: 35px;
        width: auto;
    }
    .insta-wrap {
        display: flex;
        justify-content: center;
        margin: 0 0 40px 0;
    }
    .insta-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .insta-label {
        font: 600 15pt/1em 'Nunito', sans-serif;
        color: var(--ink);
        margin: 0;
    }
    .insta-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font: 700 12.5pt/1em 'Nunito', sans-serif;
        color: var(--paper);
        background: linear-gradient(135deg, var(--teal) 0%, var(--periwinkle) 55%, var(--plum) 100%);
        padding: 13px 28px;
        border-radius: 999px;
        box-shadow: 2px 4px 10px rgba(69, 50, 87, 0.25);
        transition: transform 0.15s ease;
    }
    .insta-btn:hover {
        transform: translateY(-2px);
    }
    .insta-btn svg {
        width: 18px;
        height: 18px;
        fill: var(--paper);
    }
</style>
</head>
<body>
<div id="page">
    <div class="banner">

    </div>
    <nav class="tabs">

        <div class="dropdown">

            <div class="dropdown-menu">

    <div class="insta-wrap">

        <img src="beetlevector1.png" alt="Beetle icon">

        <img src="beetlevector2.png" alt="Beetle icon">
    </div>
</div>
</body>
</html>
