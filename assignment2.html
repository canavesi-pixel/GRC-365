<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
    @font-face {
        font-family: 'Baloo 2';
        src: url(Baloo2-VariableFont_wght.ttf);
    }
    :root {
        --navy: #2c3968;
        --plum: #453257;
        --teal: #3f7686;
        --periwinkle: #6f6f9c;
        --lavender: #8f93c0;
        --ink: #3d3a3f;
        --paper: #fffdf9;
        --blush: #f3d9e0;
    }
    body {
        background: linear-gradient(160deg, #eef2f7 0%, #f4eef7 100%);
        margin: 0;
        padding: 48px 0;
    }
    #page {
        width: 1024px;
        min-height: 1224px;
        background: var(--paper);
        margin: 0 auto;
        padding: 0 64px 64px 64px;
        box-sizing: border-box;
        box-shadow: 5px 8px 20px rgba(45, 57, 104, 0.3), 0 0 0 1px rgba(45, 57, 104, 0.08);
        overflow: hidden;
    }
    .banner {
        width: calc(100% + 128px);
        height: 220px;
        margin: 0 -64px 40px -64px;
        overflow: hidden;
    }
    .banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    nav.tabs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 0 0 44px 0;
    }
    nav.tabs a {
        font: 700 12.5pt/1em 'Nunito', sans-serif;
        letter-spacing: 0.3px;
        text-decoration: none;
        color: var(--periwinkle);
        background: #f4eef7;
        padding: 10px 26px;
        border-radius: 999px;
        border: 2px solid transparent;
        transition: border-color 0.15s ease, color 0.15s ease;
    }
    nav.tabs a:hover {
        color: var(--plum);
        border-color: var(--lavender);
    }
    nav.tabs a.active {
        color: var(--paper);
        background: var(--plum);
        box-shadow: 2px 3px 0px var(--lavender);
    }

    h1 {
        font: 700 56pt/1.0em 'Baloo 2', cursive;
        text-align: center;
        color: var(--plum);
        text-shadow: 3px 3px 0px var(--lavender);
        margin: 0;
    }
    p.intro {
        text-align: center;
        font: 600 15pt/1em 'Nunito', sans-serif;
        color: var(--ink);
        max-width: 560px;
        margin: 22px auto 40px auto;
    }
    .highlight {
        color: var(--teal);
        font-weight: 700;
    }

    .video-frame {
        display: block;
        margin: 0 auto 16px auto;
        width: 720px;
        max-width: 100%;
        border-radius: 14px;
        border: 1px solid dimgray;
        box-shadow: 2px 3px 6px dimgray;
    }
    .video-caption {
        text-align: center;
        font: 400 14pt/1.65em 'Nunito', sans-serif;
        color: var(--periwinkle);
        margin: 0 auto 40px auto;
    }
    .signature-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin: 0 0 12px 0;
    }
    .signature-row img {
        height: 35px;
        width: auto;
        opacity: 0.85;
    }

    .insta-wrap {
        display: flex;
        justify-content: center;
        margin: 0 0 40px 0;
    }
    .insta-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .insta-label {
        font: 600 15pt/1em 'Nunito', sans-serif;
        color: var(--ink);
        margin: 0;
    }
    .insta-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font: 700 12.5pt/1em 'Nunito', sans-serif;
        color: var(--paper);
        background: linear-gradient(135deg, var(--teal) 0%, var(--periwinkle) 55%, var(--plum) 100%);
        padding: 13px 28px;
        border-radius: 999px;
        box-shadow: 2px 4px 10px rgba(69, 50, 87, 0.25);
        transition: transform 0.15s ease;
    }
    .insta-btn:hover {
        transform: translateY(-2px);
    }
    .insta-btn svg {
        width: 18px;
        height: 18px;
        fill: var(--paper);
    }
</style>
</head>
<body>
<div id="page">
    <div class="banner">
        <img src="photo-by-Jeff-Biege.jpg" alt="Ocean waves crashing against shoreline!">
    </div>
    <nav class="tabs">
        <a href="assignment1.html">Home</a>
        <a href="assignment2.html" class="active">Video</a>
        <a href="assignment3.html">Portfolio</a>
    </nav>

    <h1 class="page-title">Video Introduction</h1>
    <p class="intro">Feel free to <span class="highlight">click play!</span> Here's what I'm all about:</p>

    <video class="video-frame" controls width="720" height="405" poster="video-poster.jpg">
        <source src="intro.mp4" type="video/mp4">
        Your browser doesn't support embedded video. You can
        <a href="intro.mp4">download the video</a> instead.
    </video>
    <p class="video-caption">A little tour of my assorted interests (≧◡≦)</p>

    <div class="insta-wrap">
        <div class="insta-block">
            <p class="insta-label">Find me on Instagram!</p>
            <a class="insta-btn" href="https://www.instagram.com/sole.olls/" target="_blank">
                @sole.olls
            </a>
        </div>
    </div>

    <div class="signature-row">
        <img src="fishvector1.png" alt="Fish icon">
        <img src="beetlevector1.png" alt="Beetle icon">
        <img src="fishvector2.png" alt="Fish icon">
        <img src="beetlevector2.png" alt="Beetle icon">
        <img src="fishvector1.png" alt="Fish icon">
        <img src="beetlevector1.png" alt="Beetle icon">
        <img src="fishvector2.png" alt="Fish icon">
        <img src="beetlevector2.png" alt="Beetle icon">
    </div>
</div>
</body>
</html>
