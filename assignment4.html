<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
    @font-face {
        font-family: 'Baloo 2';
        src: url(Baloo2-VariableFont_wght.ttf);
    }
    :root {
        --navy: #2c3968;
        --plum: #453257;
        --teal: #3f7686;
        --periwinkle: #6f6f9c;
        --lavender: #8f93c0;
        --ink: #3d3a3f;
        --paper: #fffdf9;
    }
    body {
        background: linear-gradient(160deg, #eef2f7 0%, #f4eef7 100%);
        margin: 0;
        padding: 48px 0;
    }
    #page {
        width: 1024px;
        min-height: 1224px;
        background: var(--paper);
        margin: 0 auto;
        padding: 0 64px 64px 64px;
        box-sizing: border-box;
        box-shadow: 5px 8px 20px rgba(45, 57, 104, 0.3), 0 0 0 1px rgba(45, 57, 104, 0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .banner {
        width: calc(100% + 128px);
        height: 220px;
        margin: 0 -64px 40px -64px;
        overflow: hidden;
    }
    .banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    nav.tabs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 0 0 44px 0;
    }
    nav.tabs a {
        font: 700 12.5pt/1em 'Nunito', sans-serif;
        letter-spacing: 0.3px;
        text-decoration: none;
        color: var(--periwinkle);
        background: #f4eef7;
        padding: 10px 26px;
        border-radius: 999px;
        border: 2px solid transparent;
        transition: border-color 0.15s ease, color 0.15s ease;
    }
    nav.tabs a:hover {
        color: var(--plum);
        border-color: var(--lavender);
    }
    nav.tabs a.active {
        color: var(--paper);
        background: var(--plum);
        box-shadow: 2px 3px 0px var(--lavender);
    }
    h1 {
        font: 700 56pt/1.0em 'Baloo 2', cursive;
        text-align: center;
        color: var(--plum);
        text-shadow: 3px 3px 0px var(--lavender);
        margin: 0;
    }
    p.intro {
        text-align: center;
        font: 600 15pt/1.5em 'Nunito', sans-serif;
        color: var(--ink);
        max-width: 620px;
        margin: 8px auto 25px auto;
    }
    .highlight {
        color: var(--teal);
        font-weight: 700;
    }
    .signature-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-top: auto;
        padding-top: 40px;
    }
    .signature-row img {
        height: 35px;
        width: auto;
        opacity: 0.85;
    }
    .gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px 24px;
}
.gallery figure {
    flex: 0 0 260px;
}
    figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .thumb-link {
        display: block;
        width: 260px;
        height: 260px;
        overflow: hidden;
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 3px 5px 12px rgba(69, 50, 87, 0.3);
    }
    .thumb-link img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.25s ease;
    }
    .thumb-link:hover img {
        transform: scale(1.05);
    }
    figcaption {
        font: 600 12.5pt/1.5em 'Nunito', sans-serif;
        color: var(--periwinkle);
        text-align: center;
        margin-top: 12px;
        max-width: 260px;
    }
    .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(44, 57, 104, 0.88);
        z-index: 999;
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
    }
    .lightbox.active {
        display: flex;
    }
    .lightbox-img {
        max-width: 90vw;
        max-height: 90vh;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        cursor: default;
    }
    .lightbox-close {
        position: absolute;
        top: 24px;
        right: 36px;
        font: 700 32px/1 'Nunito', sans-serif;
        color: var(--paper);
        cursor: pointer;
    }
    .alt-portfolio-wrap {
        display: flex;
        justify-content: center;
        margin: 35px 0 0 0;
    }
    .alt-portfolio-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font: 700 12.5pt/1em 'Nunito', sans-serif;
        color: var(--paper);
        background: linear-gradient(135deg, var(--teal) 0%, var(--periwinkle) 55%, var(--plum) 100%);
        padding: 13px 28px;
        border-radius: 999px;
        box-shadow: 2px 4px 10px rgba(69, 50, 87, 0.25);
        transition: transform 0.15s ease;
    }
    .alt-portfolio-btn:hover {
        transform: translateY(-2px);
    }
</style>
</head>
<body>
<div id="page">
    <div class="banner">
        <img src="photo-by-Jeff-Biege.jpg" alt="Ocean waves crashing against shoreline!">
    </div>
    <nav class="tabs">
        <a href="assignment1.html">Home</a>
        <a href="assignment2.html">Video</a>
        <a href="assignment4.html" class="active">Portfolio</a>
    </nav>
    <h1>Portfolio</h1>
    <p class="intro">Here's some of my work, click any piece for a <span class="highlight">closer look!</span></p>
    <div class="gallery">
        <figure>
            <a class="thumb-link" href="self-portrait1.png" onclick="return openLightbox(event, 'self-portrait1.png')">
                <img src="lowres-self-portrait1.png" alt="Horizontal Self-Portrait">
            </a>
            <figcaption>Self Portrait #1</figcaption>
        </figure>
        <figure>
            <a class="thumb-link" href="self-portrait2.png" onclick="return openLightbox(event, 'self-portrait2.png')">
                <img src="lowres-self-portrait2.png" alt="Vertical Self-Portrait" style="object-position: center top;">
            </a>
            <figcaption>Self Portrait #2</figcaption>
        </figure>
        <figure>
            <a class="thumb-link" href="frogrender.png" onclick="return openLightbox(event, 'frogrender.png')">
                <img src="lowres-frogrender.png" alt="3D render of Frog">
            </a>
            <figcaption>Frog Render (Blender)</figcaption>
        </figure>
        <figure>
            <a class="thumb-link" href="bunnyrender.png" onclick="return openLightbox(event, 'bunnyrender.png')">
                <img src="lowres-bunnyrender.png" alt="3D render of Bunny">
            </a>
            <figcaption>Bunny Render (Blender)</figcaption>
        </figure>
        <figure>
            <a class="thumb-link" href="unlikelyprotector.jpg" onclick="return openLightbox(event, 'unlikelyprotector.jpg')">
                <img src="lowres-unlikelyprotector.jpg" alt="Collage of Wolf and Lamb">
            </a>
            <figcaption>Collage (Photoshop)</figcaption>
        </figure>
        <figure>
            <a class="thumb-link" href="spookyrender.png" onclick="return openLightbox(event, 'spookyrender.png')">
                <img src="lowres-spookyrender.png" alt="Spooky 3D render of Dog and Human">
            </a>
            <figcaption>Spooky Render (Blender)</figcaption>
        </figure>
    </div>
    <div class="alt-portfolio-wrap">
        <a class="alt-portfolio-btn" href="assignment5.html">View Table-Style Portfolio!</a>
    </div>
    <div class="signature-row">
        <img src="fishvector1.png" alt="Fish icon">
        <img src="beetlevector1.png" alt="Beetle icon">
        <img src="fishvector2.png" alt="Fish icon">
        <img src="beetlevector2.png" alt="Beetle icon">
        <img src="fishvector1.png" alt="Fish icon">
        <img src="beetlevector1.png" alt="Beetle icon">
        <img src="fishvector2.png" alt="Fish icon">
        <img src="beetlevector2.png" alt="Beetle icon">
    </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" class="lightbox-img" onclick="event.stopPropagation()">
</div>
<script>
    function openLightbox(e, src) {
        e.preventDefault();
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('active');
        return false;
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
    }
</script>
</body>
</html>
